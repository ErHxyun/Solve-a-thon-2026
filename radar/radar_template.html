<title>Grant Topic Radar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: iOS grouped console. Frosted nav bar + segmented control; widget tiles; three chart cards; area list that opens a bottom sheet. */
:root {
  --bg: #f2f2f7; --card: #ffffff; --card-2: #f7f7fa; --fill: rgba(120,120,128,0.12); --fill-2: rgba(120,120,128,0.20);
  --label: #000000; --label-2: rgba(60,60,67,0.62); --label-3: rgba(60,60,67,0.38); --sep: rgba(60,60,67,0.18);
  --blue: #007aff; --red: #ff3b30; --green: #248a3d; --green-soft: rgba(52,199,89,0.16); --gray: #aeaeb2; --orange: #ff9500;
  --nav: rgba(242,242,247,0.78); --shadow: 0 1px 2px rgba(0,0,0,0.04), 0 8px 24px rgba(0,0,0,0.05);
  --sys: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
  --round: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #000000; --card: #1c1c1e; --card-2: #2c2c2e; --fill: rgba(120,120,128,0.24); --fill-2: rgba(120,120,128,0.36);
  --label: #ffffff; --label-2: rgba(235,235,245,0.62); --label-3: rgba(235,235,245,0.32); --sep: rgba(84,84,88,0.65);
  --blue: #0a84ff; --red: #ff453a; --green: #30d158; --green-soft: rgba(48,209,88,0.18); --gray: #636366; --orange: #ff9f0a;
  --nav: rgba(0,0,0,0.72); --shadow: none; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #000000; --card: #1c1c1e; --card-2: #2c2c2e; --fill: rgba(120,120,128,0.24); --fill-2: rgba(120,120,128,0.36);
  --label: #ffffff; --label-2: rgba(235,235,245,0.62); --label-3: rgba(235,235,245,0.32); --sep: rgba(84,84,88,0.65);
  --blue: #0a84ff; --red: #ff453a; --green: #30d158; --green-soft: rgba(48,209,88,0.18); --gray: #636366; --orange: #ff9f0a;
  --nav: rgba(0,0,0,0.72); --shadow: none; color-scheme: dark }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--label); font-family: var(--sys); font-size: 15px; line-height: 1.4; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--nav); }
.pad { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.col { max-width: 1080px; margin: 0 auto; }

/* nav */
.nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--nav);
  backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); border-bottom: 0.5px solid var(--sep); }
.nav .col { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 10px; flex-wrap: wrap; }
.nav .small { font-weight: 600; font-size: 16px; opacity: 0; transition: opacity .2s; }
.nav.scrolled .small { opacity: 1; }
.seg { display: inline-grid; grid-auto-flow: column; background: var(--fill); border-radius: 9px; padding: 2px; }
.seg button { font: 500 13px var(--sys); border: 0; background: transparent; color: var(--label); padding: 6px 14px; border-radius: 7px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--card); box-shadow: 0 3px 8px rgba(0,0,0,0.12), 0 0 0 0.5px rgba(0,0,0,0.04); font-weight: 600; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

.hero { padding-block: 18px 6px; }
.eyebrow { font-size: 13px; font-weight: 600; color: var(--label-2); text-transform: uppercase; letter-spacing: 0.04em; }
h1 { font: 800 clamp(30px, 5vw, 40px)/1.08 var(--sys); letter-spacing: -0.025em; margin: 4px 0 6px; text-wrap: balance; }
.lede { color: var(--label-2); max-width: 64ch; margin: 0; font-size: 15px; }

main { display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; padding-block: 14px 64px; }
main > section { min-width: 0; }
.section-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px 16px; flex-wrap: wrap; margin: 0 4px 8px; }
h2 { font: 700 21px var(--sys); letter-spacing: -0.015em; margin: 0; }
.hint { font-size: 13px; color: var(--label-2); }
.card { background: var(--card); border-radius: 18px; box-shadow: var(--shadow); padding: 16px; min-width: 0; }

/* widgets */
.widgets { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 820px) { .widgets { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.w { display: grid; gap: 8px; align-content: start; min-height: 150px; }
.w .t { font-size: 13px; font-weight: 600; color: var(--label-2); display: flex; align-items: center; gap: 6px; }
.w .dot { width: 8px; height: 8px; border-radius: 50%; }
.w .big { font: 700 34px/1 var(--round); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.w .big small { font: 600 15px var(--round); color: var(--label-2); letter-spacing: 0; }
.w .sub { font-size: 12.5px; color: var(--label-2); }
.stack { display: flex; height: 8px; border-radius: 4px; overflow: hidden; gap: 2px; }
.stack span { display: block; height: 100%; }
.minibars { display: flex; align-items: flex-end; gap: 6px; height: 46px; }
.minibars div { flex: 1; display: grid; gap: 4px; justify-items: center; min-width: 0; }
.minibars i { display: block; width: 100%; border-radius: 4px 4px 2px 2px; background: var(--blue); }
.minibars i.c { background: var(--gray); }
.minibars b { font: 500 9.5px var(--mono); color: var(--label-3); white-space: nowrap; }

/* chart cards */
.charts { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 12px; }
@media (max-width: 900px) { .charts { grid-template-columns: minmax(0, 1fr); } }
.chart { position: relative; width: 100%; }
svg text { font-family: var(--sys); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--label-2); align-items: center; }
.sw { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: 0; }
.tip { position: absolute; pointer-events: none; z-index: 5; background: var(--card-2); color: var(--label); border-radius: 12px; padding: 9px 11px;
  font-size: 12.5px; line-height: 1.4; max-width: 250px; box-shadow: 0 8px 28px rgba(0,0,0,0.18), 0 0 0 0.5px var(--sep); }
.tip b { font-weight: 600; }
.tip .m { font-family: var(--mono); font-size: 11.5px; color: var(--label-2); }

/* chips */
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 8px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; font: 500 13px var(--sys); border: 0; padding: 7px 12px; border-radius: 999px; background: var(--fill); color: var(--label); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--label); color: var(--card); }
.chip .d { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--green); margin-right: 6px; vertical-align: 1px; }

.cloud { position: relative; width: 100%; height: 380px; overflow: hidden; }
.word { position: absolute; white-space: nowrap; line-height: 1; font-weight: 650; letter-spacing: -0.015em; cursor: default; padding: 1px 2px; border-radius: 4px; }
.word.dim { opacity: 0.14; }
.grad { display: inline-block; width: 110px; height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--red), var(--label-3), var(--blue)); margin: 0 6px; vertical-align: middle; }

/* list */
.list { background: var(--card); border-radius: 18px; box-shadow: var(--shadow); overflow: hidden; }
.li { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto 14px; align-items: center; gap: 12px; padding: 11px 16px; cursor: pointer; position: relative; }
.li + .li::before { content: ""; position: absolute; top: 0; left: 62px; right: 0; border-top: 0.5px solid var(--sep); }
.li:hover { background: var(--card-2); }
.ico { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; font: 700 13px var(--round); color: #fff; background: var(--gray); }
.ico.dn { background: var(--green); }
.li .nm { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.li .meta { font-size: 12.5px; color: var(--label-2); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.fit { display: inline-flex; align-items: center; gap: 6px; }
.fit i { display: block; width: 44px; height: 5px; border-radius: 3px; background: var(--fill-2); overflow: hidden; }
.fit i b { display: block; height: 100%; background: var(--green); border-radius: 3px; }
.pill { font: 600 12.5px var(--round); padding: 4px 9px; border-radius: 999px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.pill.up { color: var(--blue); background: color-mix(in srgb, var(--blue) 13%, transparent); }
.pill.down { color: var(--red); background: color-mix(in srgb, var(--red) 13%, transparent); }
.pill.flat { color: var(--label-2); background: var(--fill); }
.chev { width: 8px; height: 13px; border-right: 2px solid var(--label-3); border-bottom: 2px solid var(--label-3); transform: rotate(-45deg) translate(-2px, -2px); justify-self: end; }
.sort { display: flex; gap: 8px; align-items: center; }

/* sheet */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,0.32); z-index: 40; }
.sheet { position: fixed; z-index: 41; left: 50%; bottom: 0; transform: translateX(-50%); width: min(680px, 100%); max-height: 86vh; overflow: auto;
  background: var(--bg); border-radius: 18px 18px 0 0; box-shadow: 0 -10px 40px rgba(0,0,0,0.25);
  padding: 8px max(16px, env(safe-area-inset-left, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-right, 0px)); }
@media (prefers-reduced-motion: no-preference) { .sheet { animation: up .28s cubic-bezier(.2,.9,.3,1); } @keyframes up { from { transform: translate(-50%, 40px); opacity: .4 } } }
.grab { width: 38px; height: 5px; border-radius: 3px; background: var(--fill-2); margin: 4px auto 10px; }
.sheet-h { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 12px; }
.sheet-h h3 { font: 700 22px var(--sys); margin: 0; letter-spacing: -0.015em; }
.done { font: 600 15px var(--sys); color: var(--blue); background: none; border: 0; cursor: pointer; padding: 4px; }
.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-bottom: 12px; }
.kpis .card { padding: 12px; }
.kpis .k { font-size: 12px; color: var(--label-2); font-weight: 600; }
.kpis .v { font: 700 24px var(--round); font-variant-numeric: tabular-nums; }
.group-t { font-size: 13px; color: var(--label-2); text-transform: uppercase; letter-spacing: .03em; margin: 14px 4px 6px; }
.ex { list-style: none; margin: 0; padding: 0; background: var(--card); border-radius: 14px; overflow: hidden; }
.ex li { padding: 10px 14px; display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 10px; position: relative; }
.ex li + li::before { content: ""; position: absolute; top: 0; left: 68px; right: 0; border-top: 0.5px solid var(--sep); }
.ex .a { font: 700 13px var(--round); color: var(--green); background: var(--green-soft); border-radius: 8px; display: grid; place-items: center; height: 28px; }
.ex .tt { font-size: 14px; }
.ex .ag { font-size: 12px; color: var(--label-2); }
.kwchips { display: flex; flex-wrap: wrap; gap: 6px; }
.kwchips span { font-size: 12.5px; padding: 5px 10px; background: var(--card); border-radius: 999px; }

.foot { font-size: 12px; color: var(--label-3); margin: 0 4px; max-width: 80ch; }
.about { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.about .card h3 { font-size: 15px; margin: 0 0 4px; }
.about .card p { margin: 0; font-size: 13px; color: var(--label-2); }
</style>

<div class="nav" id="nav"><div class="col pad">
  <span class="small">Grant Topic Radar</span>
  <div class="seg" role="tablist" aria-label="Which areas">
    <button id="t-dncr" role="tab" aria-pressed="true">DNCR areas</button>
    <button id="t-other" role="tab" aria-pressed="false">Other federal areas</button>
  </div>
</div></div>

<div class="col pad">
  <header class="hero">
    <div class="eyebrow">NC DNCR · Federal pipeline</div>
    <h1>Grant Topic Radar</h1>
    <p class="lede" id="lede"></p>
  </header>

  <main>
    <section aria-label="Summary"><div class="widgets" id="widgets"></div></section>

    <section class="charts">
      <div>
        <div class="section-h"><h2>Focus matrix</h2><span class="hint">Bubble size = grants coming</span></div>
        <div class="card"><div class="chart" id="matrix"></div></div>
      </div>
      <div>
        <div class="section-h"><h2>Growth</h2><span class="hint">1.0× = average</span></div>
        <div class="card"><div class="chart" id="growth"></div></div>
      </div>
    </section>

    <section>
      <div class="section-h"><h2>Keywords</h2><div class="legend">Fading<span class="grad" aria-hidden="true"></span>Growing</div></div>
      <div class="card">
        <div class="chips" id="chips" role="group" aria-label="Highlight an area"></div>
        <div class="cloud" id="cloud" aria-label="Keyword map"></div>
      </div>
    </section>

    <section>
      <div class="section-h"><h2>Areas</h2>
        <div class="sort"><span class="hint">Sort</span><div class="seg" role="group" aria-label="Sort areas">
          <button data-s="fit" aria-pressed="true">DNCR fit</button><button data-s="momentum" aria-pressed="false">Growth</button><button data-s="n" aria-pressed="false">Size</button>
        </div></div>
      </div>
      <div class="list" id="list"></div>
    </section>

    <p class="foot" id="foot"></p>
  </main>
</div>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-title" hidden></div>

<script>
const DATA = __DATA__;
let mode = "all", scope = "dncr", sortKey = "fit", lit = null;
function view(d) {
  const areas = d.areas.filter(a => scope === "dncr" ? a.dncr : !a.dncr);
  const sum = k => areas.reduce((s, a) => s + a[k], 0);
  const buckets = {}; for (const k of Object.keys(d.buckets)) buckets[k] = areas.reduce((s, a) => s + a.buckets[k], 0);
  return { areas, words: scope === "dncr" ? d.words_dncr : d.words_other, n: sum("n"), closed: sum("closed"), coming: sum("coming"), buckets, allN: d.n };
}
const $ = s => document.querySelector(s);
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const ABBR = { "Parks & outdoor recreation": "PK", "Historic preservation & heritage": "HP", "Arts, humanities & museums": "AH",
  "Conservation & wildlife": "CW", "Climate, ocean & environment": "CO", "Disaster & emergency": "DE", "Agriculture & food": "AG",
  "Transportation & infrastructure": "TR", "Housing & community": "HC", "Education & STEM": "ED", "Workforce & small business": "WB",
  "Justice & public safety": "JS", "Energy, tech & AI": "EN", "Foreign diplomacy & exchange": "FD", "Public health & prevention": "PH",
  "Mental health & substance use": "MH", "Cancer & military medicine": "CM", "Biomedical & science research": "BR", "Other": "OT" };
const x2 = v => v == null ? "–" : v.toFixed(2).replace(/0$/, "") + "×";
const cls = m => m == null ? "flat" : m >= 1.1 ? "up" : m <= 0.9 ? "down" : "flat";
const mtxt = m => m == null ? "few grants" : (m >= 1.1 ? "↑ " : m <= 0.9 ? "↓ " : "") + x2(m);
const NS = "http://www.w3.org/2000/svg";
function svgEl(W, H, label) { const s = document.createElementNS(NS, "svg"); s.setAttribute("viewBox", `0 0 ${W} ${H}`); s.setAttribute("width", W); s.setAttribute("height", H); s.setAttribute("role", "img"); s.setAttribute("aria-label", label); return s; }
function add(svg, tag, at, txt) { const e = document.createElementNS(NS, tag); for (const k in at) e.setAttribute(k, at[k]); if (txt != null) e.textContent = txt; svg.appendChild(e); return e; }
function tipFor(el) { let t = el.querySelector(".tip"); if (!t) { t = document.createElement("div"); t.className = "tip"; t.hidden = true; el.appendChild(t); } return t; }
function areaTip(a) { return `<b>${a.name}</b><br><span class="m">${a.n} grants · ${a.closed} closed · ${a.coming} coming</span><br>Growth ${mtxt(a.momentum)} · DNCR fit ${a.fit.toFixed(0)}`; }

/* ---------- widgets ---------- */
function widgets(v) {
  const scored = v.areas.filter(a => a.momentum != null && a.name !== "Other");
  const top = [...scored].sort((a, b) => b.momentum - a.momentum)[0];
  const best = [...v.areas].filter(a => a.name !== "Other").sort((a, b) => b.fit - a.fit)[0];
  const b = v.buckets, mx = Math.max(1, ...Object.values(b));
  const bar = (k, lab, c) => `<div><i class="${c || ""}" style="height:${Math.max(3, b[k] / mx * 34)}px"></i><b>${lab}</b></div>`;
  const f = v.n / v.allN, r = 22, C = 2 * Math.PI * r;
  $("#widgets").innerHTML = `
    <div class="card w"><div class="t"><i class="dot" style="background:var(--green)"></i>Grants</div>
      <div style="display:flex;align-items:center;gap:12px">
        <svg width="56" height="56" viewBox="0 0 56 56" aria-hidden="true"><circle cx="28" cy="28" r="${r}" fill="none" stroke="${css("--fill-2")}" stroke-width="7"/>
          <circle cx="28" cy="28" r="${r}" fill="none" stroke="${css(scope === "dncr" ? "--green" : "--blue")}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${Math.max(f * C, 3)} ${C}" transform="rotate(-90 28 28)"/></svg>
        <div class="big">${v.n}</div></div>
      <div class="sub">${Math.round(f * 1000) / 10}% of ${v.allN.toLocaleString()} federal listings</div></div>
    <div class="card w"><div class="t"><i class="dot" style="background:var(--blue)"></i>Coming</div>
      <div class="big">${v.coming}<small> of ${v.n}</small></div>
      <div class="minibars" aria-hidden="true">${bar("Closed", "past", "c")}${bar("2026", "'26")}${bar("2027", "'27")}${bar("2028+", "'28+")}${bar("Forecast", "fcst")}</div></div>
    <div class="card w"><div class="t"><i class="dot" style="background:var(--green)"></i>Best fit</div>
      <div class="big" style="color:var(--green)">${best ? best.fit.toFixed(0) : "–"}</div>
      <div class="sub" style="color:var(--label);font-weight:600;font-size:14px">${best ? best.name : ""}</div></div>
    <div class="card w"><div class="t"><i class="dot" style="background:var(--orange)"></i>Fastest growing</div>
      <div class="big" style="color:var(--blue)">${top ? x2(top.momentum) : "–"}</div>
      <div class="sub" style="color:var(--label);font-weight:600;font-size:14px">${top ? top.name : ""}</div>
      <div class="sub">${top ? `${top.closed} closed → ${top.coming} coming` : ""}</div></div>`;
}

/* ---------- focus matrix ---------- */
function matrix(d) {
  const el = $("#matrix"); el.innerHTML = "";
  const W = el.clientWidth, H = Math.max(300, Math.min(400, W * 0.7)), narrow = W < 520;
  const m = { l: 34, r: 12, t: 10, b: 30 };
  const pts = d.areas.filter(a => a.name !== "Other").map(a => ({ ...a, mx: a.momentum ?? 1 }));
  const X = v => m.l + (Math.min(Math.max(v, 0.3), 1.7) - 0.3) / 1.4 * (W - m.l - m.r);
  const yMax = scope === "dncr" ? 60 : Math.max(20, Math.ceil(Math.max(...pts.map(p => p.fit)) * 1.3 / 5) * 5);
  const Y = v => H - m.b - v / yMax * (H - m.t - m.b);
  const maxC = Math.max(...pts.map(p => p.coming)), R = c => 4 + Math.sqrt(c / maxC) * (narrow ? 16 : 22);
  const svg = svgEl(W, H, "Areas by growth and DNCR fit");
  const midY = Y(yMax / 2), midX = X(1);
  // quadrant tints
  add(svg, "rect", { x: midX, y: m.t, width: W - m.r - midX, height: midY - m.t, rx: 10, fill: css("--green-soft") });
  add(svg, "rect", { x: m.l, y: m.t, width: midX - m.l, height: midY - m.t, rx: 10, fill: css("--fill") });
  const q = (x, y, t, a, c) => add(svg, "text", { x, y, "text-anchor": a, "font-size": 11, "font-weight": 700, fill: c, "letter-spacing": ".02em" }, t);
  q(W - m.r - 8, m.t + 16, "FOCUS NOW", "end", css("--green"));
  q(m.l + 8, m.t + 16, "FITS · FADING", "start", css("--label-2"));
  q(W - m.r - 8, H - m.b - 8, "GROWING · OFF-PLAN", "end", css("--label-3"));
  for (const v of [0, yMax / 2, yMax]) add(svg, "text", { x: m.l - 6, y: Y(v) + 4, "text-anchor": "end", "font-size": 10.5, fill: css("--label-3") }, v);
  for (const v of [0.5, 1, 1.5]) add(svg, "text", { x: X(v), y: H - 10, "text-anchor": "middle", "font-size": 10.5, fill: css("--label-3") }, v + "×");
  add(svg, "line", { x1: midX, x2: midX, y1: m.t, y2: H - m.b, stroke: css("--sep"), "stroke-dasharray": "3 4" });
  add(svg, "line", { x1: m.l, x2: W - m.r, y1: midY, y2: midY, stroke: css("--sep"), "stroke-dasharray": "3 4" });
  const tip = tipFor(el);
  const order = [...pts].sort((a, b) => b.coming - a.coming);
  for (const p of order) {
    const c = add(svg, "circle", { cx: X(p.mx), cy: Y(p.fit), r: R(p.coming), fill: scope === "dncr" ? css("--green") : css("--blue"),
      "fill-opacity": scope === "dncr" ? 0.92 : 0.55, stroke: css("--card"), "stroke-width": 2, tabindex: 0, role: "button", "aria-label": p.name });
    c.style.cursor = "pointer";
    const show = () => { tip.hidden = false; tip.innerHTML = areaTip(p) + "<br><span class='m'>Tap for details</span>";
      tip.style.left = Math.min(X(p.mx) + 10, W - 255) + "px"; tip.style.top = Math.max(Y(p.fit) - 70, 0) + "px"; };
    c.onmouseenter = show; c.onfocus = show; c.onmouseleave = c.onblur = () => tip.hidden = true;
    c.onclick = () => openSheet(p.name); c.onkeydown = e => { if (e.key === "Enter") openSheet(p.name); };
  }
  const lab = (scope === "dncr" ? pts : order.slice(0, narrow ? 3 : 5)).map(p => ({ p, x: X(p.mx), y: Y(p.fit), r: R(p.coming) })).sort((a, b) => a.y - b.y);
  const used = [];
  for (const l of lab) {
    const name = narrow ? l.p.name.split(/[ ,&]/)[0] : l.p.name;
    let y = l.y + 4; while (used.some(u => Math.abs(u - y) < 13)) y += 13; used.push(y);
    const right = l.x + l.r + 8 + name.length * 6.2 > W - m.r;
    add(svg, "text", { x: right ? l.x - l.r - 5 : l.x + l.r + 5, y, "text-anchor": right ? "end" : "start", "font-size": 11.5, "font-weight": 600, fill: css("--label") }, name);
  }
  el.prepend(svg);
}

/* ---------- growth diverging bars ---------- */
function growth(d) {
  const el = $("#growth"); el.innerHTML = "";
  const rows = d.areas.filter(a => a.momentum != null && a.name !== "Other").sort((a, b) => b.momentum - a.momentum);
  const W = el.clientWidth, rh = 22, H = rows.length * rh + 26, lw = Math.min(170, W * 0.42);
  const x0 = lw + 8, x1 = W - 44, X = v => x0 + (Math.min(Math.max(v, 0.3), 1.7) - 0.3) / 1.4 * (x1 - x0), mid = X(1);
  const svg = svgEl(W, H, "Growth by area");
  add(svg, "line", { x1: mid, x2: mid, y1: 0, y2: H - 18, stroke: css("--label-3") });
  for (const v of [0.5, 1.5]) add(svg, "text", { x: X(v), y: H - 4, "text-anchor": "middle", "font-size": 10.5, fill: css("--label-3") }, v + "×");
  add(svg, "text", { x: mid, y: H - 4, "text-anchor": "middle", "font-size": 10.5, fill: css("--label-2"), "font-weight": 600 }, "1×");
  const tip = tipFor(el);
  rows.forEach((a, i) => {
    const y = i * rh + 4, v = a.momentum, up = v >= 1, bx = up ? mid : X(v), bw = Math.max(Math.abs(X(v) - mid), 2);
    const short = W < 420 ? a.name.replace(/ &.*| ,.*/, "").replace(/,.*/, "") : a.name;
    add(svg, "text", { x: lw, y: y + 12, "text-anchor": "end", "font-size": 11.5, "font-weight": 500, fill: css("--label") }, short);
    const r = add(svg, "rect", { x: bx, y: y + 3, width: bw, height: 12, rx: 4, fill: up ? css("--blue") : css("--red"), "fill-opacity": 0.9 });
    add(svg, "text", { x: up ? X(v) + 5 : mid + 5, y: y + 13, "text-anchor": "start", "font-size": 10.5, fill: css("--label-2"), "font-family": css("--mono") }, x2(v));
    const hit = add(svg, "rect", { x: 0, y, width: W, height: rh, fill: "transparent" }); hit.style.cursor = "pointer";
    hit.onmouseenter = () => { tip.hidden = false; tip.innerHTML = areaTip(a); tip.style.left = Math.min(mid, W - 255) + "px"; tip.style.top = (y + rh + 4 > H - 80 ? y - 70 : y + rh + 4) + "px"; };
    hit.onmouseleave = () => tip.hidden = true; hit.onclick = () => openSheet(a.name);
  });
  el.prepend(svg);
}

/* ---------- keyword map ---------- */
function mix(a, b, t) { const p = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)); const A = p(a), B = p(b);
  return "#" + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, "0")).join(""); }
function wordColor(m) { const n = document.documentElement.matches(":root[data-theme='dark']") || (matchMedia("(prefers-color-scheme: dark)").matches && !document.documentElement.matches("[data-theme='light']")) ? "#8e8e93" : "#6c6c70";
  return m >= 1 ? mix(n, css("--blue"), Math.min((m - 1) / 0.6, 1)) : mix(n, css("--red"), Math.min((1 - m) / 0.6, 1)); }
function chips(d) {
  const names = d.areas.filter(a => d.words.some(w => w.area === a.name)).sort((a, b) => b.n - a.n);
  $("#chips").innerHTML = `<button class="chip" aria-pressed="${lit === null}" data-a="">All</button>` +
    names.map(a => `<button class="chip" aria-pressed="${lit === a.name}" data-a="${a.name}">${a.name}</button>`).join("");
  document.querySelectorAll("#chips .chip").forEach(b => b.onclick = () => { lit = b.dataset.a || null; chips(DATA[mode]); cloud(DATA[mode]); });
}
function cloud(d) {
  const el = $("#cloud"); el.innerHTML = "";
  const W = el.clientWidth, narrow = W < 560, H = narrow ? 480 : 380; el.style.height = H + "px";
  const ctx = document.createElement("canvas").getContext("2d");
  const ws = [...d.words].sort((a, b) => b.n - a.n), maxN = ws[0].n, minN = ws[ws.length - 1].n;
  const placed = [], tip = document.createElement("div"); tip.className = "tip"; tip.hidden = true;
  for (const w of ws) {
    const fs = Math.round((12 + Math.sqrt((w.n - minN) / (maxN - minN || 1)) * 32) * (narrow ? 0.66 : 1));
    ctx.font = `650 ${fs}px -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif`;
    const bw = ctx.measureText(w.text).width + 8, bh = fs * 1.08 + 4;
    let ok = false, x, y;
    for (let t = 0; t < 2600 && !ok; t++) {
      const a = t * 0.2, r = 2 * a; x = W / 2 + r * Math.cos(a) * 1.55 - bw / 2; y = H / 2 + r * Math.sin(a) * 0.8 - bh / 2;
      if (x < 2 || y < 2 || x + bw > W - 2 || y + bh > H - 2) continue;
      ok = !placed.some(p => x < p.x + p.w && x + bw > p.x && y < p.y + p.h && y + bh > p.y);
    }
    if (!ok) continue;
    placed.push({ x, y, w: bw, h: bh });
    const s = document.createElement("span"); s.className = "word" + (lit && w.area !== lit ? " dim" : ""); s.textContent = w.text; s.tabIndex = 0;
    Object.assign(s.style, { left: x + 4 + "px", top: y + 2 + "px", fontSize: fs + "px", color: wordColor(w.momentum) });
    const show = () => { tip.hidden = false; tip.innerHTML = `<b>${w.text}</b><br><span class="m">${w.n} titles · ${w.coming} coming</span><br>Growth ${mtxt(w.momentum)} · mostly ${w.area}`;
      tip.style.left = Math.min(x, W - 255) + "px"; tip.style.top = (y + bh + 70 > H ? y - 72 : y + bh + 4) + "px"; };
    s.onmouseenter = show; s.onfocus = show; s.onmouseleave = s.onblur = () => tip.hidden = true;
    el.appendChild(s);
  }
  el.appendChild(tip);
}

/* ---------- list ---------- */
function list(d) {
  const rows = [...d.areas].sort((a, b) => (b[sortKey] ?? -1) - (a[sortKey] ?? -1));
  $("#list").innerHTML = rows.map(a => `<div class="li" tabindex="0" role="button" data-n="${a.name}">
      <div class="ico ${a.dncr ? "dn" : ""}" aria-hidden="true">${ABBR[a.name] || "··"}</div>
      <div style="min-width:0"><div class="nm">${a.name}</div>
        <div class="meta"><span>${a.n} grants · ${a.coming} coming</span><span class="fit">fit <i><b style="width:${Math.min(a.fit / 60 * 100, 100)}%"></b></i>${a.fit.toFixed(0)}</span></div></div>
      <span class="pill ${cls(a.momentum)}">${mtxt(a.momentum)}</span><span class="chev" aria-hidden="true"></span></div>`).join("");
  document.querySelectorAll("#list .li").forEach(r => { r.onclick = () => openSheet(r.dataset.n); r.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openSheet(r.dataset.n); } }; });
}

/* ---------- sheet ---------- */
let lastFocus = null;
function openSheet(name) {
  const a = DATA[mode].areas.find(x => x.name === name); if (!a) return;
  lastFocus = document.activeElement;
  const B = ["Closed", "2026", "2027", "2028+", "Forecast"], L = ["Recently closed", "2026", "2027", "2028+", "Forecast"], mx = Math.max(1, ...B.map(k => a.buckets[k]));
  const bars = `<svg viewBox="0 0 320 120" width="100%" height="120" role="img" aria-label="Grants by deadline">` + B.map((k, i) => {
    const h = a.buckets[k] / mx * 80, x = 14 + i * 62;
    return `<rect x="${x}" y="${92 - h}" width="40" height="${Math.max(h, 1.5)}" rx="5" fill="${k === "Closed" ? css("--gray") : css("--blue")}"/>
      <text x="${x + 20}" y="${86 - h}" text-anchor="middle" font-size="11" font-weight="600" fill="${css("--label")}">${a.buckets[k]}</text>
      <text x="${x + 20}" y="110" text-anchor="middle" font-size="9.5" fill="${css("--label-2")}">${L[i]}</text>`; }).join("") + `</svg>`;
  $("#sheet").innerHTML = `<div class="grab" aria-hidden="true"></div>
    <div class="sheet-h"><div><div class="eyebrow">${a.dncr ? "DNCR plan area" : "Federal grant area"}</div><h3 id="sh-title">${a.name}</h3></div><button class="done" id="done">Done</button></div>
    <div class="kpis"><div class="card"><div class="k">Grants</div><div class="v">${a.n}</div></div>
      <div class="card"><div class="k">Growth</div><div class="v" style="color:${a.momentum == null ? "var(--label-2)" : a.momentum >= 1 ? "var(--blue)" : "var(--red)"}">${x2(a.momentum)}</div></div>
      <div class="card"><div class="k">DNCR fit</div><div class="v" style="color:var(--green)">${a.fit.toFixed(0)}</div></div></div>
    <div class="group-t">Grants by deadline</div><div class="card" style="padding:8px 10px">${bars}</div>
    <div class="group-t">Top keywords</div><div class="kwchips">${a.keywords.map(k => `<span>${k}</span>`).join("")}</div>
    <div class="group-t">Strongest DNCR matches</div><ul class="ex">${a.examples.map(e => `<li><span class="a">${e.A}</span><div><div class="tt">${e.title}</div>
      <div class="ag">${e.agency} · ${e.bucket === "Closed" ? "closed" : e.deadline ? "due " + e.deadline : "forecast"}</div></div></li>`).join("")}</ul>
    <p class="hint" style="margin:10px 4px 0">The number is each grant's plan-match score A (0–100).</p>`;
  $("#sheet").hidden = false; $("#scrim").hidden = false; document.body.style.overflow = "hidden";
  $("#done").focus(); $("#done").onclick = closeSheet;
}
function closeSheet() { $("#sheet").hidden = true; $("#scrim").hidden = true; document.body.style.overflow = ""; lastFocus && lastFocus.focus && lastFocus.focus(); }
$("#scrim").onclick = closeSheet;
addEventListener("keydown", e => { if (e.key === "Escape" && !$("#sheet").hidden) closeSheet(); });

/* ---------- wiring ---------- */
function render() { const d = DATA[mode], v = view(d);
  $("#lede").textContent = scope === "dncr" ? "Where federal grant money is growing or fading across DNCR's six plan areas."
    : "The rest of the federal pipeline, for comparison and for grants another agency should lead.";
  widgets(v); matrix(v); growth(v); chips(v); cloud(v); list(v);
  $("#foot").textContent = `Grants.gov snapshot, ${d.n.toLocaleString()} listings, as of ${DATA.as_of}. Growth = share of grants open or forecast vs. recently closed (1.0× = average). Fit = average plan-match score A (0–100).`; }
const setScope = s2 => { scope = s2; lit = null; $("#t-dncr").setAttribute("aria-pressed", s2 === "dncr"); $("#t-other").setAttribute("aria-pressed", s2 === "other"); render(); };
$("#t-dncr").onclick = () => setScope("dncr"); $("#t-other").onclick = () => setScope("other");
document.querySelectorAll(".sort button").forEach(b => b.onclick = () => { sortKey = b.dataset.s;
  document.querySelectorAll(".sort button").forEach(x => x.setAttribute("aria-pressed", x === b)); list(DATA[mode]); });
addEventListener("scroll", () => $("#nav").classList.toggle("scrolled", scrollY > 90), { passive: true });
let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(render, 150); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", render);
new MutationObserver(render).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
render();
</script>
